<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">

<title>Brain Dump</title>

<style>

/* ================================
   RESET
================================ */

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}

button,
textarea {
    font-family: inherit;
}


/* ================================
   APP
================================ */

.app {
    width: 100%;
    min-height: 100vh;
    overflow: hidden;
}
.page-window {
    width: 100%;
    height: 100vh;
    min-height: 100vh;
    overflow-x: hidden;
    overflow-y: auto;
}
.page-slider {
    display: flex;
    width: 300vw;
    min-width: 300vw;
    align-items: flex-start;
    transition: transform 0.3s ease;
}
.page {
    width: 100vw;
    min-width: 100vw;
    max-width: 100vw;
    flex: 0 0 100vw;
    box-sizing: border-box;
    padding: 30px 30px 110px;
    overflow: hidden;
}


/* ================================
   BRAIN DUMP
================================ */

.dump-page {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.dump-page > * {
    width: 100%;
    max-width: 850px;
}

.header {
    margin-top: 10px;
    margin-bottom: 22px;
}

.brand {
    display: flex;
    align-items: center;
}

.logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
}

.brand-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.brand-text h1 {
    font-size: 22px;
    font-weight: 700;
}

.tagline {
    color: #666;
    font-size: 12px;
}

.dump-box {
    background: #111;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 20px;
}

.textarea-wrapper {
    position: relative;
}

textarea {
    width: 100%;
    min-height: 260px;
    resize: vertical;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 18px;
    line-height: 1.6;
    padding-right: 55px;
}

textarea::placeholder {
    color: #555;
}
/* ================================
   SWIPE TO DELETE
================================ */

.item-wrapper {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
    margin-bottom: 8px;
}

.delete-background {
    position: absolute;
    inset: 0;

    display: flex;
    align-items: center;
    justify-content: flex-end;

    padding-right: 22px;

    background: #4a1111;
    color: #ff5555;

    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.5px;

    border-radius: 12px;

    pointer-events: none;
}
.item {
    position: relative;
    z-index: 2;

    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;

    background: #111;

    transition:
        transform 0.15s ease,
        background 0.15s ease;
}

.item.swiping {
    transition: none !important;
}

.item.swiping {
    transition: none;
}
/* ================================
   CATEGORY ADD BUTTON
================================ */

.category-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.category-header h3 {
    margin: 0;
}

.add-item {
    background: transparent;
    color: #888;
    border: 1px solid #333;
    border-radius: 8px;

    padding: 7px 11px;

    font-size: 12px;
    font-weight: bold;

    cursor: pointer;
    white-space: nowrap;

    transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease;
}

.add-item:hover {
    background: #181818;
    color: white;
    border-color: #555;
}

/* ================================
   MIC
================================ */

.mic-button {
    position: absolute;
    right: 10px;
    bottom: 10px;

    width: 42px;
    height: 42px;

    padding: 0;

    border-radius: 50%;
    border: 1px solid #333;

    background: #181818;
    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 18px;
    cursor: pointer;

    transition:
        background 0.2s ease,
        border-color 0.2s ease,
        transform 0.2s ease;
}
.empty-message {
    color: #555;
    font-size: 13px;
    padding: 6px 0;
}
.mic-button:hover {
    background: #222;
    border-color: #555;
    transform: none;
}

.mic-button:active {
    transform: scale(0.92);
}

.mic-button.listening {
    background: #ff3b3b;
    border-color: #ff3b3b;
    animation: micPulse 1.2s infinite;
}

@keyframes micPulse {

    0% {
        box-shadow: 0 0 0 0 rgba(255,59,59,0.5);
    }

    70% {
        box-shadow: 0 0 0 12px rgba(255,59,59,0);
    }

    100% {
        box-shadow: 0 0 0 0 rgba(255,59,59,0);
    }
}

#voiceStatus.listening {
    color: #ff3b3b;
}


/* ================================
   BOTTOM OF DUMP
================================ */

.bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-top: 15px;
}

.hint {
    color: #555;
    font-size: 13px;
}

.organize-button {
    border: none;
    background: white;
    color: black;
    padding: 13px 24px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.organize-button:hover {
    background: #ddd;
    transform: translateY(-2px);
}


/* ================================
   TASK PAGE
================================ */

.tasks-page {
    max-width: 850px;

}

.page-title {
    margin-bottom: 20px;
}

.page-title h2 {

}

.page-title p {

}

.results {

}

}

.item-wrapper {

}

.delete-background {
    position: absolute;

    display: flex;

/* ================================

================================ */

.clear-all-container {

/* ================================

================================ */

.more-page {

.more-page-inner {

.more-menu {

.more-menu-item {

.saved-lists-header {

/* ================================
   BOTTOM NAV
================================ */

/* ================================
   BOTTOM NAV
================================ */

.bottom-nav {
    position: fixed;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

<body>

<main class="app">

<div id="results">

<script>

/* ========================================
   DATA
======================================== */

let tasks = [];
let reminders = [];
let shopping = [];
let ideas = [];
let notes = [];

let savedLists = [];

let recognition = null;
let isListening = false;


/* ========================================
   PAGE NAVIGATION
======================================== */
function showPage(page) {

    const slider = document.getElementById("pageSlider");
    const pageWindow = document.querySelector(".page-window");

    if (!slider) return;

    // Always reset vertical scroll when changing pages
    if (pageWindow) {
        pageWindow.scrollTo({
            top: 0,
            behavior: "instant"
        });
    }

    window.scrollTo({
        top: 0,
        behavior: "instant"
    });

    if (page === "tasks") {
        slider.style.transform = "translateX(0)";
    }

    if (page === "dump") {
        slider.style.transform = "translateX(-100vw)";
    }

    if (page === "more") {
        slider.style.transform = "translateX(-200vw)";
    }
}


/* ========================================
   NORMAL DATA
======================================== */

function loadData() {

    const savedData =
        localStorage.getItem("brainDumpData");

    if (!savedData) {
        displayAll();
        return;
    }

    try {

        const data =
            JSON.parse(savedData);

        tasks =
            Array.isArray(data.tasks)
                ? data.tasks
                : [];

        reminders =
            Array.isArray(data.reminders)
                ? data.reminders
                : [];

        shopping =
            Array.isArray(data.shopping)
                ? data.shopping
                : [];

        ideas =
            Array.isArray(data.ideas)
                ? data.ideas
                : [];

        notes =
            Array.isArray(data.notes)
                ? data.notes
                : [];

    } catch (error) {

        console.error(
            "Could not load Brain Dump data.",
            error
        );

    }

    displayAll();
}

        alert(
            "Could not find that saved list."
        );

        return;
    }

    const confirmed =
        confirm(
            `Load "${list.name}"?\n\n` +
            "This will replace your current My Tasks list."
        );

    if (!confirmed) {
        return;
    }

    tasks =
        [...(list.tasks || [])];

    reminders =
        [...(list.reminders || [])];

    shopping =
        [...(list.shopping || [])];

    ideas =
        [...(list.ideas || [])];

    displayAll();

    closeSavedLists();

}


function deleteSavedList(id) {

    const list =
        savedLists.find(
            savedList =>
                savedList.id === id
        );

    if (!list) {
        return;
    }

    const confirmed =
        confirm(
            `Delete "${list.name}"?\n\n` +
            "This cannot be undone."
        );

    if (!confirmed) {
        return;
    }

    savedLists =
        savedLists.filter(
            savedList =>
                savedList.id !== id
        );

    saveSavedListsData();

    displaySavedLists();
}


/* ========================================
   ORGANIZER
======================================== */

function organizeDump() {

    stopVoiceInput();

    const textarea =
        document.getElementById(
            "brainInput"
        );

    if (!textarea) {
        return;
    }

    const input =
        textarea.value.trim();

    if (!input) {

        alert(
            "Dump something first!"
        );

        return;
    }

    const thoughts =
        parseBrainDump(input);

    thoughts.forEach(item => {

        const thought =
            item.text.trim();

        if (!thought) {
            return;
        }


        /* TASKS */

        if (
            item.section === "tasks"
        ) {

            if (
                !tasks.some(
                    task =>
                        task.toLowerCase() ===
                        thought.toLowerCase()
                )
            ) {

                tasks.push(thought);
            }


            if (item.date) {

                const reminderDate =
                    getReminderDate(
                        item.date
                    );

                if (reminderDate) {

                    addReminder(
                        reminderDate,
                        thought
                    );

                }

            }

            return;
        }


        /* REMINDERS */

        if (
            item.section === "reminders"
        ) {

            const reminderDate =
                item.date
                    ? getReminderDate(item.date)
                    : "For later";

            addReminder(
                reminderDate || "For later",
                thought
            );

            return;
        }


        /* SHOPPING */

        if (
            item.section === "shopping"
        ) {

            if (
                !shopping.some(
                    value =>
                        value.toLowerCase() ===
                        thought.toLowerCase()
                )
            ) {

                shopping.push(thought);

            }

            return;
        }


        /* IDEAS */

        if (
            item.section === "ideas"
        ) {

            if (
                !ideas.some(
                    value =>
                        value.toLowerCase() ===
                        thought.toLowerCase()
                )
            ) {

                ideas.push(thought);

            }

            return;
        }


        /* NOTES */

        if (
            item.section === "notes"
        ) {

            if (
                !notes.some(
                    value =>
                        value.toLowerCase() ===
                        thought.toLowerCase()
                )
            ) {

                notes.push(thought);

            }

        }

    });


    saveData();

    displayAll();

    textarea.value = "";

    showPage("tasks");
}


/* ========================================
   PARSER
======================================== */

function parseBrainDump(input) {

    const thoughts = [];

    let text =
        input
            .replace(/\r\n/g, "\n")
            .replace(/\r/g, "\n");


    /*
       Commas are boundaries.
    */

    text =
        text.replace(
            /,/g,
            "\n"
        );


    /*
       Split obvious sentence boundaries.
    */

    const lines =
        text
            .split(/\n+/)
            .map(line => line.trim())
            .filter(Boolean);

const trigger =
    /\b(?:i need to|i have to|i gotta|i should|remind me to|remind me|remind me for|remember to|remember|video idea|content idea|idea|i have an idea|i got an idea|buy|buying|purchase|pick up|pickup|order|make|finish|complete|do|clean|wash|call|record|edit|upload|create|fix|build|pay|organize|check|visit|go|work|maybe record|note|notes)\b/gi;

    function splitLine(line) {

        const matches = [];

        let match;

        while (
            (match = trigger.exec(line)) !== null
        ) {

            matches.push(match.index);

        }

        trigger.lastIndex = 0;

        if (
            matches.length <= 1
        ) {

            return [line];

        }


        const result = [];


        for (
            let i = 0;
            i < matches.length;
            i++
        ) {

            const start =
                matches[i];

            const end =
                i + 1 <
                matches.length
                    ? matches[i + 1]
                    : line.length;

            const piece =
                line
                    .slice(start, end)
                    .trim();

            if (piece) {
                result.push(piece);
            }

        }


        /*
           Preserve text before first trigger.
        */

        if (
            matches[0] > 0
        ) {

            const before =
                line
                    .slice(
                        0,
                        matches[0]
                    )
                    .trim();

            if (before) {
                result.unshift(before);
            }

        }

        return result;
    }


    const expanded = [];

    lines.forEach(line => {

        splitLine(line)
            .forEach(piece => {

                if (piece.trim()) {
                    expanded.push(
                        piece.trim()
                    );
                }

            });

    });


    expanded.forEach(original => {

        let text =
            cleanText(original);

        if (!text) {
            return;
        }


        let date =
            extractDate(text);

        text =
            date.text;

        if (!text) {
            return;
        }

/*
   REMINDER
*/

if (
    /^(remind me to|remind me for|remind me|remind|remember to|remember)\b/i
        .test(text)
) {

    let reminderText =
        text.replace(
            /^(remind me to|remind me for|remind me|remind|remember to|remember)\s*/i,
            ""
        );


    reminderText =
        cleanText(reminderText);


    if (reminderText) {

        const inlineDate =
            extractInlineDate(reminderText);


        /*
           Remove date/time wording from
           the actual reminder text.
        */

        let cleanedReminder =
            removeDateWords(reminderText);


        cleanedReminder =
            removeTimeWords(cleanedReminder);


        cleanedReminder =
            cleanText(cleanedReminder);


        if (cleanedReminder) {

            thoughts.push({

                text: cleanedReminder,

                section: "reminders",

                date:
                    inlineDate ||
                    "For later"

            });

        }

    }

    return;
}


        /*
           IDEA
        */
if (
    /^(video idea|content idea|idea|i have an idea|i got an idea)\b/i
        .test(text)
){
let ideaText =
    text.replace(
        /^(video idea|content idea|idea|i have an idea|i got an idea)\s*(for|about)?\s*:?\s*/i,
        ""
    );

            ideaText =
                cleanText(ideaText);

            if (ideaText) {

                thoughts.push({

                    text: ideaText,

                    section: "ideas",

                    date: null

                });

            }

            return;
        }


        /*
           NOTE
        */

        if (
            /^(note|notes)\b/i
                .test(text)
        ) {

            let noteText =
                text.replace(
                    /^(note|notes)\s*:?\s*/i,
                    ""
                );

            noteText =
                cleanText(noteText);

            if (noteText) {

                thoughts.push({

                    text: noteText,

                    section: "notes",

                    date: null

                });

            }

            return;
        }


        /*
           SHOPPING
        */

        if (
            /^(buy|buying|purchase|pick up|pickup|order)\b/i
                .test(text)
        ) {

            let shoppingText =
                text.replace(
                    /^(buy|buying|purchase|pick up|pickup|order)\s*/i,
                    ""
                );

            shoppingText =
                removeDateWords(
                    shoppingText
                );


            /*
               Handle common shopping
               lists like:

               eggs milk bacon
               eggs and milk
               eggs, milk
            */

            const items =
                splitShoppingItems(
                    shoppingText
                );

            items.forEach(item => {

                if (item) {

                    thoughts.push({

                        text: item,

                        section: "shopping",

                        date: null

                    });

                }

            });

            return;
        }


        /*
           TASK
        */

        if (
            /^(i need to|i have to|i gotta|i should|make|finish|complete|do|clean|wash|call|record|edit|upload|create|fix|build|pay|organize|check|visit|go|work|maybe record)\b/i
                .test(text)
        ) {

            let taskText =
                text.replace(
                    /^(i need to|i have to|i gotta|i should)\s*/i,
                    ""
                );

            taskText =
                taskText.replace(
                    /^maybe\s+/i,
                    ""
                );

            taskText =
                cleanText(
                    removeDateWords(
                        taskText
                    )
                );

            /*
               Split:
               call dentist and make videos
            */

            const taskParts =
                splitTasks(taskText);

            taskParts.forEach(part => {

                if (part) {

                    thoughts.push({

                        text: part,

                        section: "tasks",

                        date:
                            date.date ||
                            extractInlineDate(
                                original
                            )

                    });

                }

            });

            return;
        }


        /*
           FALLBACK
        */

        thoughts.push({

            text: text,

            section: "notes",

            date: null

        });

    });


    return thoughts;
}


/* ========================================
   SPLIT TASKS
======================================== */

function splitTasks(text) {

    const result = [];

    const pattern =
        /\s+\band\s+(?=(?:make|finish|complete|do|clean|wash|call|record|edit|upload|create|fix|build|pay|organize|check|visit|go|work|maybe|i need|i have|i should)\b)/gi;

    const pieces =
        text.split(pattern);

    pieces.forEach(piece => {

        const cleaned =
            cleanText(piece);

        if (cleaned) {
            result.push(cleaned);
        }

    });

    return result;
}


/* ========================================
   SHOPPING SPLITTER
======================================== */

function splitShoppingItems(text) {

    text =
        cleanText(text);


    if (!text) {
        return [];
    }


    /*
       First split commas and "and".
    */

    let items =
        text
            .split(
                /\s*(?:,|\band\b)\s*/i
            )
            .map(item =>
                cleanText(item)
            )
            .filter(Boolean);


    /*
       If there is still only one long
       shopping phrase, recognize common
       food/household item words.
    */

    if (
        items.length === 1
    ) {

        const commonItems =
            [
                "eggs",
                "milk",
                "bacon",
                "soda",
                "bread",
                "water",
                "cheese",
                "chicken",
                "beef",
                "rice",
                "toothpaste",
                "paper towels",
                "toilet paper",
                "snacks",
                "chips",
                "cereal",
                "coffee",
                "soap",
                "shampoo",
                "deodorant"
            ];


        let remaining =
            items[0];


        const found = [];


        commonItems.forEach(item => {

            const regex =
                new RegExp(
                    "\\b" +
                    item.replace(
                        " ",
                        "\\s+"
                    ) +
                    "\\b",
                    "i"
                );


            if (
                regex.test(
                    remaining
                )
            ) {

                found.push(item);

                remaining =
                    remaining.replace(
                        regex,
                        ""
                    );

            }

        });


        remaining =
            cleanText(remaining);


        if (found.length > 0) {

            items = [
                ...found
            ];

            if (remaining) {
                items.push(remaining);
            }

        }

    }


    return items;
}


/* ========================================
   DATE
======================================== */

function extractDate(text) {

    const pattern =
        /^(today|tomorrow|tonight|this weekend|next week|next month|monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i;

    const match =
        text.match(pattern);

    if (!match) {

        return {

            date: null,

            text: text

        };

    }


    return {

        date: match[1],

        text:
            text
                .replace(
                    pattern,
                    ""
                )
                .trim()

    };
}


function extractInlineDate(text) {

    return getReminderDate(text);
}

function getReminderDate(text) {

    if (!text) {
        return null;
    }

    const lower =
        text.toLowerCase();


    if (/\btomorrow\b/.test(lower)) {
        return "Tomorrow";
    }


    if (/\btoday\b/.test(lower)) {
        return "Today";
    }


    if (/\btonight\b/.test(lower)) {
        return "Tonight";
    }


    if (/\bthis weekend\b/.test(lower)) {
        return "This weekend";
    }


    if (/\bnext week\b/.test(lower)) {
        return "Next week";
    }


    if (/\bnext month\b/.test(lower)) {
        return "Next month";
    }


    const days = {

        monday: "Monday",
        tuesday: "Tuesday",
        wednesday: "Wednesday",
        thursday: "Thursday",
        friday: "Friday",
        saturday: "Saturday",
        sunday: "Sunday"

    };


    for (const day in days) {

        if (
            new RegExp(
                "\\b" + day + "\\b",
                "i"
            ).test(lower)
        ) {

            return days[day];

        }

    }


    return null;
}


function removeTimeWords(text) {

    return text

        .replace(
            /\b(?:at\s+)?\d{1,2}(?::\d{2})?\s*(?:am|pm)\b/gi,
            ""
        )

        .replace(
            /\b(?:at\s+)?\d{1,2}\s*(?:o'clock)\b/gi,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}
function removeDateWords(text) {

    return text

        .replace(
            /\b(today|tomorrow|tonight|this weekend|next week|next month)\b/gi,
            ""
        )

        .replace(
            /\b(monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/gi,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}


/* ========================================
   REMINDERS
======================================== */

function addReminder(
    date,
    text
) {

    if (!text) {
        return;
    }

    const exists =
        reminders.some(
            reminder =>
                reminder.date === date &&
                reminder.text.toLowerCase() ===
                text.toLowerCase()
        );

    if (!exists) {

        reminders.push({

            date: date,

            text: text

        });

    }
}


/* ========================================
   CLEAN TEXT
======================================== */

function cleanText(text) {

    return String(text || "")

        .replace(
            /^[-*•☐☑]\s*/i,
            ""
        )

        .replace(
            /^\[\s*[x ]\s*\]\s*/i,
            ""
        )

        .replace(
            /\s+/g,
            " "
        )

        .trim();
}

function displayItems(category, items, emptyMessage) {
    const element = document.getElementById(category);

    if (!element) return;

    if (!items.length) {
        element.innerHTML = `
            <div class="empty-message">
                ${escapeHTML(emptyMessage)}
            </div>
        `;
        return;
    }

    element.innerHTML = items.map((item, index) => `
        <div class="item-wrapper">
            <div class="delete-background">
                DELETE
            </div>

            <div
                class="item task-item"
                data-index="${index}"
            >
                <span class="checkbox">☐</span>

                <span class="task-text">
                    ${escapeHTML(item)}
                </span>
            </div>
        </div>
    `).join("");

    element.querySelectorAll(".item-wrapper").forEach((wrapper, index) => {

        const row = wrapper.querySelector(".item");

        let suppressClick = false;

        row.addEventListener("click", function() {
            if (suppressClick) {
                suppressClick = false;
                return;
            }

            toggleItem(row);
        });

        setupSwipeDelete(row, category, index, function() {
            suppressClick = true;
        });
    });
}
function setupSwipeDelete(row, category, index, onDelete) {
    let startX = 0;
    let currentX = 0;
    let dragging = false;
    let pointerId = null;

    const threshold = 100;
    const maxSwipe = 180;

    row.addEventListener("pointerdown", function(e) {

        if (e.pointerType === "mouse" && e.button !== 0) {
            return;
        }

        startX = e.clientX;
        currentX = e.clientX;
        dragging = true;
        pointerId = e.pointerId;

        row.setPointerCapture(e.pointerId);
        row.classList.add("swiping");
    });

    row.addEventListener("pointermove", function(e) {

        if (!dragging || e.pointerId !== pointerId) {
            return;
        }

        const delta = e.clientX - startX;

        if (delta > 0) {
            row.style.transform = "translateX(0)";
            return;
        }

        currentX = e.clientX;

        const distance = Math.max(delta, -maxSwipe);

        row.style.transform = `translateX(${distance}px)`;
    });

    row.addEventListener("pointerup", finish);

    row.addEventListener("pointercancel", finish);

    function finish(e) {

        if (!dragging) {
            return;
        }

        const delta = currentX - startX;

        dragging = false;
        row.classList.remove("swiping");

        if (delta <= -threshold) {

            if (onDelete) {
                onDelete();
            }

            row.style.transform = "translateX(-100%)";

            setTimeout(function() {
                removeItemAt(category, index);
            }, 150);

        } else {

            row.style.transform = "translateX(0)";
        }
    }
}
function removeItemAt(category, index) {

    if (category === "tasks") {
        tasks.splice(index, 1);
    }

    else if (category === "reminders") {
        reminders.splice(index, 1);
    }

    else if (category === "shopping") {
        shopping.splice(index, 1);
    }

    else if (category === "ideas") {
        ideas.splice(index, 1);
    }

    else if (category === "notes") {
        notes.splice(index, 1);
    }

    saveData();
    displayAll();
}
function displayReminders() {

    const element =
        document.getElementById(
            "reminders"
        );

    if (!element) {
        return;
    }


    if (reminders.length === 0) {

        element.innerHTML = `

            <div class="item">
                No reminders detected yet.
            </div>

        `;

        return;
    }


    element.innerHTML = "";


    reminders.forEach(
        function(reminder, index) {

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "item-wrapper";


            wrapper.innerHTML = `

                <div class="delete-background">
                    DELETE
                </div>

                <div class="item">

                    🔔

                    <strong>
                        ${escapeHTML(reminder.date)}
                    </strong>

                    —
                    ${escapeHTML(reminder.text)}

                </div>

            `;


            const row =
                wrapper.querySelector(".item");


            element.appendChild(wrapper);


            setupSwipeDelete(
                row,
                "reminders",
                index
            );

        }
    );
}
/* ========================================
   ADD ITEMS
======================================== */
function addItem(category) {
    const labels = {
        tasks: "task",
        reminders: "reminder",
        shopping: "shopping item",
        ideas: "idea",
        notes: "note"
    };

    const text = prompt(`Add a ${labels[category]}:`);

    if (!text || !text.trim()) {
        return;
    }

    const value = text.trim();

    if (category === "tasks") {
        tasks.push(value);
    }

    else if (category === "reminders") {
        const date = getReminderDate(value) || "For later";

        reminders.push({
            date: date,
            text: value
        });
    }

    else if (category === "shopping") {
        shopping.push(value);
    }

    else if (category === "ideas") {
        ideas.push(value);
    }

    else if (category === "notes") {
        notes.push(value);
    }

    saveData();
    displayAll();
}

/* ========================================
   CHECKBOX
======================================== */

function toggleItem(element) {

    element.classList.toggle(
        "completed"
    );


    const checkbox =
        element.querySelector(
            ".checkbox"
        );

    if (!checkbox) {
        return;
    }


    if (
        element.classList.contains(
            "completed"
        )
    ) {

        checkbox.textContent = "☑";

    } else {

        checkbox.textContent = "☐";

    }
}


/* ========================================
   CLEAR EVERYTHING
======================================== */

function clearAllData() {

    const confirmed =
        confirm(
            "Are you sure you want to clear everything?\n\n" +
            "This will delete all tasks, reminders, shopping items, ideas, and notes."
        );

    if (!confirmed) {
        return;
    }


    tasks = [];

    reminders = [];

    shopping = [];

    ideas = [];

    notes = [];


    localStorage.removeItem(
        "brainDumpData"
    );


    displayAll();

    alert(
        "Brain Dump has been cleared."
    );
}


/* ========================================
   HTML SECURITY
======================================== */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        String(text);

    return div.innerHTML;
}


/* ========================================
   VOICE RECOGNITION
======================================== */

function setupVoiceRecognition() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        console.warn(
            "Speech recognition is not supported in this browser."
        );

        return;
    }


    recognition =
        new SpeechRecognition();


    recognition.continuous = true;

    recognition.interimResults = true;

    recognition.lang = "en-US";


    recognition.onstart =
        function() {

            isListening = true;


            const micButton =
                document.getElementById(
                    "micButton"
                );

            const voiceStatus =
                document.getElementById(
                    "voiceStatus"
                );


            if (micButton) {

                micButton.classList.add(
                    "listening"
                );

                micButton.textContent =
                    "⏹️";

                micButton.setAttribute(
                    "aria-label",
                    "Stop voice input"
                );

            }


            if (voiceStatus) {

                voiceStatus.textContent =
                    "Listening... speak freely.";

                voiceStatus.classList.add(
                    "listening"
                );

            }

        };
recognition.onresult = function(event) {

    let finalTranscript = "";

    for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
    ) {

        if (event.results[i].isFinal) {

            finalTranscript +=
                event.results[i][0].transcript;

        }

    }

    if (!finalTranscript.trim()) {
        return;
    }


    /*
       Convert spoken commands into
       actual line breaks.
    */

    finalTranscript = finalTranscript
        .replace(/\bnew line\b/gi, "\n")
        .replace(/\bnewline\b/gi, "\n")
        .replace(/\bnext line\b/gi, "\n")
        .replace(/\benter\b/gi, "\n");


    const textarea =
        document.getElementById("brainInput");


    if (!textarea) {
        return;
    }


    /*
       Add ONLY FINAL speech.
       This prevents interim speech
       from duplicating.
    */

    if (textarea.value.trim()) {

        textarea.value +=
            " " + finalTranscript.trim();

    } else {

        textarea.value =
            finalTranscript.trim();

    }


    textarea.focus();

    textarea.setSelectionRange(
        textarea.value.length,
        textarea.value.length
    );

};

/* CLOSE VOICE RECOGNITION SETUP */
}


/* ========================================
   VOICE INPUT TOGGLE
======================================== */

function toggleVoiceInput() {

    if (!recognition) {

        alert(
            "Voice input is not supported by this browser."
        );

        return;
    }


    if (isListening) {

        stopVoiceInput();

        return;
    }


    try {

        recognition.start();

    } catch (error) {

        console.warn(
            "Could not start voice recognition.",
            error
        );

    }

}


function stopVoiceInput() {

    if (
        recognition &&
        isListening
    ) {

        try {

            recognition.stop();

        } catch (error) {

            console.warn(
                "Could not stop voice recognition.",
                error
            );

        }

    }


    isListening = false;


    const micButton =
        document.getElementById(
            "micButton"
        );

    const voiceStatus =
        document.getElementById(
            "voiceStatus"
        );


    if (micButton) {

        micButton.classList.remove(
            "listening"
        );

        micButton.textContent =
            "🎙️";

        micButton.setAttribute(
            "aria-label",
            "Start voice input"
        );

    }


    if (voiceStatus) {

        voiceStatus.textContent =
            "Don't organize it. Just dump it.";

        voiceStatus.classList.remove(
            "listening"
        );

    }

}


/* ========================================
   KEYBOARD
======================================== */

function setupBrainDumpKeyboard() {

    const textarea =
        document.getElementById("brainInput");

    if (!textarea) {
        return;
    }

    textarea.addEventListener("keydown", function(e) {

        /*
           SHIFT + ENTER
           ----------------
           Allow a normal new line.
        */

        if (e.key === "Enter" && e.shiftKey) {
            return;
        }


        /*
           ENTER
           ----------------
           Organize the Brain Dump.
        */

        if (e.key === "Enter") {

            e.preventDefault();

            organizeDump();

            return;
        }


        /*
           BACKSPACE
           ----------------
           Do absolutely nothing.
           This allows normal deleting.
        */

        if (e.key === "Backspace") {
            return;
        }

    });

}
